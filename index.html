<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Portalı</title>
    <script>
        // Tema ve oturum, sayfa çizilmeden önce uygulanır (açılıştaki titremeyi önler)
        (function () {
            try {
                var root = document.documentElement;
                if (localStorage.getItem('theme') === 'light') root.classList.add('light');
                if (localStorage.getItem('isLoggedIn') === 'true') root.classList.add('logged-in');
            } catch (e) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        html.logged-in #login-overlay { display: none; }
        html.logged-in #main-content { display: block; }

        html.light body { background-color: #f3f4f6; color: #111827; }
        html.light ::-webkit-scrollbar-track { background: #e5e7eb; }
        html.light ::-webkit-scrollbar-thumb { background: #9ca3af; }
        html.light .card, html.light .category-card, html.light .modal-content, html.light #login-overlay > div, html.light .dashboard-note-bg, html.light #reminder-modal > div { background-color: #ffffff; border-color: #e5e7eb; }
        html.light .text-header { color: #1f2937; }
        html.light .text-subheader { color: #4b5563; }
        html.light .card:hover, html.light .category-card:hover { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); }
        html.light .footer-text { color: #6b7280; }
        html.light #weather-widget, html.light #theme-toggle, html.light #lock-toggle { background-color: #ffffff; border-color: #e5e7eb; color: #4b5563; }
        html.light #theme-toggle:hover { background-color: #f3f4f6; }
        html.light #lock-toggle:hover { background-color: #dc2626; color: #ffffff; }
        html.light .modal-bg, html.light #login-overlay, html.light #reminder-modal { background-color: rgba(0, 0, 0, 0.5); }

        .note-item { display: flex; align-items: center; justify-content: space-between; padding: 1rem; border-radius: 0.75rem; background-color: #374151; margin-bottom: 0.75rem; transition: background-color 0.2s; }
        .note-item:hover { background-color: #4b5563; }
        html.light .note-item { background-color: #f3f4f6; }
        html.light .note-item:hover { background-color: #e5e7eb; }

        #login-overlay { transition: opacity 0.5s ease-in-out; }

        .weather-card { display: flex; align-items: center; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 0.5rem 1rem; border-radius: 1rem; margin-right: 1rem; }
        html.light .weather-card { background: rgba(0, 0, 0, 0.05); }

        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: flex; width: max-content; white-space: nowrap; animation: marquee 165s linear infinite; will-change: transform; }
        .market-bar { height: 34px; overflow: hidden; flex-shrink: 0; border-bottom: 1px solid rgba(75,85,99,.55); }
        .market-bar .tradingview-widget-container { height: 42px; transform: scale(.86); transform-origin: left top; width: 116%; }
        #news-bar { height: 34px; font-size: 12px; }
        #news-ticker-content a { color: inherit; text-decoration: none; }
        #news-ticker-content a:hover { color: #fff; text-decoration: underline; }
        html.light .market-bar { background: #fff; border-color: #d1d5db; }
        html.light #news-bar { background: #fff; border-color: #d1d5db; }
        html.light #news-ticker-track { background: #f3f4f6; color: #374151; }
        html.light #news-ticker-content a:hover { color: #111827; }
        .news-ticker-container:hover .animate-marquee { animation-play-state: paused; }


        /* Modal içeriklerinin özellikle mobilde gerçek anlamda kaydırılabilmesi */
        .modal-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            max-height: min(90vh, calc(100dvh - 76px)) !important;
        }
        .modal-content > section,
        .modal-content > .overflow-y-auto {
            flex: 0 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            padding: .85rem .15rem .25rem;
        }

        input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        html.light input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(0); }


        .glass-panel { background: rgba(31, 41, 55, 0.78); border: 1px solid rgba(107, 114, 128, 0.32); backdrop-filter: blur(14px); }
        html.light .glass-panel { background: rgba(255,255,255,0.88); border-color: #e5e7eb; }
        .app-count { font-size: .72rem; font-weight: 700; padding: .25rem .55rem; border-radius: 999px; background: rgba(255,255,255,.1); color: #d1d5db; }
        html.light .app-count { background: #f3f4f6; color: #4b5563; }
        .modal-sticky-header { position: relative; flex: 0 0 auto; z-index: 20; margin: -1.5rem -1.5rem 0; padding: 1.1rem 1.5rem 1rem; background: rgba(31,41,55,.96); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(107,114,128,.25); border-radius: 1rem 1rem 0 0; }
        html.light .modal-sticky-header { background: rgba(255,255,255,.96); border-color: #e5e7eb; }
        .quick-card { transition: transform .2s, background-color .2s; }
        .quick-card:hover { transform: translateY(-3px); }
        .ticker-hidden { transform: translateY(100%); }
        #news-bar { transition: transform .3s ease; }

        /* Kişisel Projeler > Dosyalar (GitHub'daki son APK/IPA/EXE) */
        .dosya-bolum { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(107,114,128,.35); }
        .dosya-ust { display: flex; align-items: center; gap: .5rem; margin-bottom: .75rem; flex-wrap: wrap; }
        .dosya-ust h3 { font-size: 1.25rem; font-weight: 700; margin-right: auto; }
        .dosya-dugme { font-size: .8rem; padding: .35rem .7rem; border-radius: .6rem; background: #374151; border: 1px solid #4b5563; color: #d1d5db; }
        .dosya-dugme:hover { background: #4b5563; color: #fff; }
        .dosya-grup { font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #9ca3af; margin: 1rem 0 .5rem; }
        .dosya-liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .6rem; }
        .dosya-satir { display: flex; align-items: center; gap: .7rem; padding: .7rem .8rem; border-radius: .8rem; background: #374151; color: inherit; text-decoration: none; min-width: 0; transition: background-color .2s; }
        .dosya-satir:hover { background: #4b5563; }
        .dosya-tur { flex-shrink: 0; width: 2.6rem; text-align: center; font-size: .68rem; font-weight: 800; padding: .45rem 0; border-radius: .5rem; color: #fff; }
        .dosya-tur.apk { background: #16a34a; } .dosya-tur.ipa { background: #2563eb; } .dosya-tur.exe { background: #9333ea; }
        .dosya-bilgi { min-width: 0; flex: 1; }
        .dosya-ad { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dosya-alt { font-size: .75rem; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dosya-not { font-size: .85rem; color: #9ca3af; padding: .5rem 0; }
        html.light .dosya-satir { background: #f3f4f6; } html.light .dosya-satir:hover { background: #e5e7eb; }
        html.light .dosya-dugme { background: #fff; border-color: #d1d5db; color: #374151; }
        html.light .dosya-alt, html.light .dosya-not, html.light .dosya-grup { color: #6b7280; }

        @media (max-width: 768px) {
            .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .modal-content { padding: 1rem; max-height: calc(100dvh - 82px) !important; border-radius: 1rem; }
            .modal-bg { align-items: flex-start; padding: 40px .5rem 42px; }
            .modal-sticky-header { margin: -1rem -1rem 0; padding: .9rem 1rem .8rem; }
            .animate-marquee { animation-duration: 240s; }
            .top-info-bar { flex-direction: column; gap: 1rem; }
            #main-content { padding-bottom: 3.25rem; }
        }
        @media (max-width: 480px) {
            .card-grid { grid-template-columns: 1fr !important; }
            #projects-grid .card { padding: .85rem; }
            #project-search { padding: .7rem; }
            .top-actions { width: 100%; justify-content: space-between; }
        }
    </style>

    <script>
    // =====================================================================
    // UYGULAMA LİSTESİ — yeni bir link eklemek için ilgili listeye tek satır ekleyin.
    //   ad       : kart başlığı
    //   aciklama : kartın alt yazısı (Diğer Uygulamalar'da gösterilmez)
    //   url      : açılacak adres
    //   renk     : simge rengi — TKGM/Projeler için "bg-...", Diğer için "text-..."
    //              (bg/text-[renk]-[400|500|600] hepsi hazır; başka bir sınıf için README'ye bakın)
    //   simge    : aşağıdaki SIMGELER listesindeki bir ad
    // Kategori sayıları ("10 uygulama" vb.) bu listelerden otomatik hesaplanır.
    // =====================================================================
    const UYGULAMALAR = {
        tkgm: [
            { ad: 'EBYS',         aciklama: 'Elektronik Belge', url: 'https://ebys.tkgm.gov.tr/edys-web/sistemeGiris.xhtml', renk: 'bg-gray-500',   simge: 'belge' },
            { ad: 'BULUT',        aciklama: 'TKGM Bulut',       url: 'https://bulut.tkgm.gov.tr/',                           renk: 'bg-cyan-400',   simge: 'bulut' },
            { ad: 'CBS',          aciklama: 'Coğrafi Bilgi',    url: 'https://cbs.tkgm.gov.tr/login.aspx',                   renk: 'bg-green-500',  simge: 'kure' },
            { ad: 'TKGM',         aciklama: 'Kurumsal Site',    url: 'https://www.tkgm.gov.tr/',                             renk: 'bg-blue-500',   simge: 'kurum' },
            { ad: 'YBS',          aciklama: 'Yönetim Bilgi',    url: 'https://ybs.tkgm.gov.tr/',                             renk: 'bg-yellow-500', simge: 'pasta' },
            { ad: 'YTS',          aciklama: 'Yatırım Takip',    url: 'https://yts.tkgm.gov.tr/',                             renk: 'bg-red-500',    simge: 'trend' },

    document.addEventListener('DOMContentLoaded', () => {
        // --- 1. VERİ TANIMLAMALARI ---
        const correctPassword = '5034';

        const root = document.documentElement;
        const loginOverlay = document.getElementById('login-overlay');
        const mainContent = document.getElementById('main-content');
        const passwordInput = document.getElementById('password-input');
        const loginError = document.getElementById('login-error');

        // --- 2. KARTLARI LİSTEDEN OLUŞTUR ---
        const escapeHtml = (value = '') => String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));

        const svg = (ad, sinif) => {
            const s = SIMGELER[ad] || SIMGELER.belge;
            if (typeof s === 'object') {
                return `<svg class="${sinif}" fill="currentColor" viewBox="${s.vb || '0 0 24 24'}"><path d="${s.d}"></path></svg>`;
            }
            return `<svg class="${sinif}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${s}"></path></svg>`;
        };

        const satirKart = (a) => `<a href="${escapeHtml(a.url)}" target="_blank" rel="noopener" class="card bg-gray-700 rounded-xl shadow-lg p-4 flex items-center space-x-3 hover:bg-gray-600"><div class="${a.renk} p-2 rounded-lg">${svg(a.simge, 'w-5 h-5 text-white')}</div><div><h2 class="text-lg font-semibold text-header">${escapeHtml(a.ad)}</h2><p class="text-sm text-subheader">${escapeHtml(a.aciklama)}</p></div></a>`;

        const ikonKart = (a) => `<a href="${escapeHtml(a.url)}" target="_blank" rel="noopener" class="bg-gray-700 hover:bg-gray-600 p-4 rounded-xl flex flex-col items-center justify-center space-y-2 transition-all hover:scale-105">${svg(a.simge, ('w-8 h-8 ' + a.renk).trim())}<span class="font-semibold text-header">${escapeHtml(a.ad)}</span></a>`;

        document.getElementById('tkgm-grid').innerHTML = UYGULAMALAR.tkgm.map(satirKart).join('');
        document.getElementById('projects-grid').innerHTML = UYGULAMALAR.projects.map(satirKart).join('');
        document.getElementById('other-grid').innerHTML = UYGULAMALAR.other.map(ikonKart).join('');

        Object.keys(UYGULAMALAR).forEach(k => {
            const el = document.querySelector(`[data-count="${k}"]`);
            if (el) el.textContent = `${UYGULAMALAR[k].length} uygulama`;
        });

        // --- 3. STANDART FONKSİYONLAR ---

        function performLogin(animate = true) {
            localStorage.setItem('isLoggedIn', 'true');
            root.classList.add('logged-in');
            if (!animate) {
                loginOverlay.style.display = 'none';
                mainContent.classList.remove('hidden');
                return;
            }
            loginOverlay.classList.add('opacity-0');
            setTimeout(() => {
                loginOverlay.style.display = 'none';
                mainContent.classList.remove('hidden');
            }, 300);
        }

        const handleLoginAttempt = () => {
            const val = passwordInput.value.trim();
            if (val === correctPassword) {
                performLogin();
            } else if (val !== "") {
                loginError.textContent = 'Şifre Hatalı!';
                passwordInput.value = '';
                passwordInput.focus();
                setTimeout(() => loginError.textContent = '', 3000);
            }
        };

        // Event Listeners
        document.getElementById('login-button').addEventListener('click', handleLoginAttempt);
        passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLoginAttempt(); });

        document.getElementById('lock-toggle').addEventListener('click', () => {
            localStorage.removeItem('isLoggedIn');
            location.reload();
        });

        window.openModal = (id) => {
            const m = document.getElementById(id);
            m.classList.remove('hidden');
            setTimeout(() => { m.classList.remove('opacity-0'); m.children[0].classList.remove('scale-95'); }, 10);
        };
        window.closeModal = (id) => {
            const m = document.getElementById(id);
            m.classList.add('opacity-0'); m.children[0].classList.add('scale-95');
            setTimeout(() => m.classList.add('hidden'), 300);
        };

        ['tkgm','projects','other'].forEach(k => {
            document.getElementById('open-'+k+'-modal').onclick = () => openModal(k+'-modal');
            const m = document.getElementById(k+'-modal');
            m.querySelectorAll('.close-modal-btn').forEach(b => b.onclick = () => closeModal(k+'-modal'));
            m.onclick = (e) => { if(e.target===m) closeModal(k+'-modal'); };
        });

        // Esc ile açık pencereyi kapat
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            document.querySelectorAll('.modal-bg:not(.hidden)').forEach(m => closeModal(m.id));
        });

        const updateTime = () => {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleTimeString('tr-TR');
            document.getElementById('date').textContent = now.toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        };
        setInterval(updateTime, 1000); updateTime();

        const themeToggle = document.getElementById('theme-toggle');
        const applyTheme = (t) => {
            if(t === 'light') { root.classList.add('light'); themeToggle.innerHTML = '🌙'; }
            else { root.classList.remove('light'); themeToggle.innerHTML = '☀️'; }
        };
        let currTheme = localStorage.getItem('theme') || 'dark';
        applyTheme(currTheme);
        themeToggle.onclick = () => {
            currTheme = currTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', currTheme);
            applyTheme(currTheme);
        };

        // Hava durumu (Open-Meteo WMO hava kodları)
        const havaDurumu = (kod, gunduz) => {
            if (kod === 0) return gunduz ? ['☀️', 'Açık'] : ['🌙', 'Açık'];
            if (kod === 1) return gunduz ? ['🌤️', 'Az bulutlu'] : ['🌙', 'Az bulutlu'];
            if (kod === 2) return ['⛅', 'Parçalı bulutlu'];
            if (kod === 3) return ['☁️', 'Kapalı'];
            if (kod === 45 || kod === 48) return ['🌫️', 'Sisli'];
            if (kod >= 51 && kod <= 57) return ['🌦️', 'Çisenti'];
            if (kod >= 61 && kod <= 67) return ['🌧️', 'Yağmurlu'];
            if (kod >= 71 && kod <= 77) return ['🌨️', 'Karlı'];
            if (kod >= 80 && kod <= 82) return ['🌦️', 'Sağanak'];
            if (kod === 85 || kod === 86) return ['🌨️', 'Kar sağanağı'];
            if (kod >= 95) return ['⛈️', 'Gök gürültülü'];
            return ['🌡️', ''];
        };

        async function updateData() {
            try {
                let wRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=36.8121&longitude=34.6415&current_weather=true');
                let wData = await wRes.json();
                const cw = wData.current_weather;
                const [ikon, aciklama] = havaDurumu(cw.weathercode, cw.is_day !== 0);
                const metin = aciklama ? `Mersin · ${aciklama}` : 'Mersin';
                document.getElementById('weather-temp').textContent = Math.round(cw.temperature) + '°C';
                document.getElementById('weather-icon').textContent = ikon;
                document.getElementById('weather-desc').textContent = metin;
                document.getElementById('weather-widget').title = `${metin} · ${Math.round(cw.temperature)}°C`;
            } catch(e) {}
        }
        updateData();
        setInterval(updateData, 30 * 60 * 1000);

        // Haberler
        const rssSources = [
            'https://www.trthaber.com/sondakika.rss',
            'https://www.cnnturk.com/feed/66/index.rss',
            'https://www.haberturk.com/rss/kategori/gundem.xml',
            'https://www.ntv.com.tr/gundem.rss',
            'https://www.star.com.tr/rss/sondakika.xml'
        ];

        async function fetchFeed(source) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);
            try {
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source)}&t=${Date.now()}`, {
                    signal: controller.signal
                });
                if (!res.ok) throw new Error('Servis hatası');
                const data = await res.json();
                if (data.status !== 'ok' || !data.items || data.items.length === 0) throw new Error('Boş veri');
                return data.items;
            } finally {
                clearTimeout(timeoutId);
            }
        }

        async function updateNews() {
            const ticker = document.getElementById('news-ticker-content');

            const render = (items) => {
                const shuffled = [...items].sort(() => 0.5 - Math.random()).slice(0, 18);
                const itemHtml = shuffled.map(i => {
                    const title = escapeHtml(i.title || 'Haberi aç');
                    const link = i.link || `https://news.google.com/search?q=${encodeURIComponent(i.title || '')}&hl=tr&gl=TR&ceid=TR:tr`;
                    return `<a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center mx-5 h-8">
                        <span class="text-red-400 font-bold mr-2">•</span>${title}
                    </a>`;
                }).join('');
                ticker.innerHTML = itemHtml + itemHtml;
                ticker.style.animation = 'none';
                void ticker.offsetWidth;
                ticker.style.animation = '';
            };

            // Kaynakları rastgele sırayla dene; ilk çalışan kullanılır
            const sources = [...rssSources].sort(() => 0.5 - Math.random());
            for (const source of sources) {
                try {
                    render(await fetchFeed(source));
                    return;
                } catch (e) {
                    console.log("Haber kaynağı değiştiriliyor...");
                }
            }

            // Hiçbiri çalışmazsa uydurma başlık yerine durumu açıkça göster
            ticker.style.animation = 'none';
            ticker.innerHTML = `<a href="https://news.google.com/home?hl=tr&gl=TR&ceid=TR:tr" target="_blank" rel="noopener noreferrer" class="inline-flex items-center mx-5 h-8">
                <span class="text-red-400 font-bold mr-2">•</span>Haberler şu an yüklenemedi. Gündem için Google Haberler'i açın.
            </a>`;
        }



        updateNews();
        setInterval(updateNews, 5 * 60 * 1000);

        // Karşılama metni
        const hour = new Date().getHours();
        document.getElementById('greeting').textContent = `${hour < 12 ? 'Günaydın' : hour < 18 ? 'İyi günler' : 'İyi akşamlar'} Müdürüm`;

        // Haber bandı göster/gizle
        const newsBar = document.getElementById('news-bar');
        document.getElementById('ticker-toggle').onclick = () => {
            const track = document.getElementById('news-ticker-track');
            const btn = document.getElementById('ticker-toggle');
            const collapsed = track.classList.toggle('hidden');
            newsBar.style.width = collapsed ? 'auto' : '';
            newsBar.style.left = collapsed ? 'auto' : '0';
            btn.textContent = collapsed ? 'Haberler' : '×';
            btn.title = collapsed ? 'Haber bandını göster' : 'Haber bandını gizle';
            newsBar.querySelector('.bg-red-600').classList.toggle('hidden', collapsed);
        };

        // Kişisel projelerde yalnızca arama
        const projectGrid = document.getElementById('projects-grid');
        const projectCards = [...projectGrid.querySelectorAll(':scope > a')];
        projectCards.forEach(card => {
            const title = card.querySelector('h2')?.textContent.trim() || '';
            const description = card.querySelector('p')?.textContent.trim() || '';
            card.dataset.search = `${title} ${description}`.toLocaleLowerCase('tr-TR');
        });
        document.getElementById('project-search').addEventListener('input', (event) => {
            const query = event.target.value.toLocaleLowerCase('tr-TR').trim();
            projectCards.forEach(card => card.classList.toggle('hidden', !card.dataset.search.includes(query)));
            document.querySelectorAll('#dosya-icerik .dosya-satir').forEach(a => a.classList.toggle('hidden', !a.dataset.search.includes(query)));
        });

        // --- DOSYALAR: GitHub'daki en güncel APK / IPA / EXE dosyaları ---
        // 1) Herkese açık gokhangeo/apk deposunun apk/ klasörü ve sürümleri (anahtarsız).
        // 2) Gizli gokhangeo/rea sürümleri: her uygulamanın SON sürümü. Gizli depo olduğu için
        //    bu cihazda bir kez "Rea anahtarı" (yalnızca okuma izinli GitHub anahtarı) girilir;
        //    anahtar yalnızca bu tarayıcıda saklanır. İndirme GitHub'a giriş yapılmış tarayıcıda açılır.
        const DOSYA_UZANTI = /\.(apk|ipa|exe)$/i;
        const UYGULAMA_ADI = {
            '': 'Ataç', 'atac-py': 'Ataç (Python)', 'ev-ekrani': 'Ev Ekranı', 'arac-ekrani': 'Araç Ekranı',
            'turkiptv': 'TurkIPTV', 'turkiptv-ios': 'TurkIPTV iOS', 'zip-zip': 'Zıp Zıp', 'kutu-kurucu': 'Kutu Kurucu',
            'winkeeper': 'WinKeeper', 'winkeeper-android': 'WinKeeper Android', 'megsis-otomatik-onay': 'MEGSİS Otomatik Onay',
            'centik': 'Çentik', 'notebook': 'Notebook Asistan',
        };
        const anahtarAl = () => { try { return localStorage.getItem('reaToken') || ''; } catch (e) { return ''; } };
        const boyut = (b) => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
        const tarih = (t) => t ? new Date(t).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
        const aile = (etiket) => etiket.replace(/-?v?\d+(\.\d+)*$/i, '').toLowerCase();
        const ghJson = async (yol, anahtar) => {
            const h = { Accept: 'application/vnd.github+json' };
            if (anahtar) h.Authorization = 'Bearer ' + anahtar;
            const r = await fetch('https://api.github.com/' + yol, { headers: h, cache: 'no-store' });
            if (!r.ok) throw new Error(r.status === 401 || r.status === 404 ? 'anahtar' : 'HTTP ' + r.status);
            return r.json();
        };
        // Her uygulama ailesinin en yeni sürümündeki apk/ipa/exe dosyaları
        const sonSurumler = (surumler) => {
            const enYeni = {};
            surumler.filter(r => !r.draft && r.assets.some(a => DOSYA_UZANTI.test(a.name))).forEach(r => {
                const k = aile(r.tag_name);
                if (!enYeni[k] || new Date(r.published_at) > new Date(enYeni[k].published_at)) enYeni[k] = r;
            });
            // Aynı sürümde aynı türden birden çok dosya varsa tek dosya: EXE'de kurulum, APK'da sürüm numaralı olan
            const tercih = (a) => /setup|kurulum/i.test(a.name) ? (/\.exe$/i.test(a.name) ? 0 : 2) : 1;
            return Object.entries(enYeni).flatMap(([k, r]) => {
                const tek = {};
                r.assets.filter(a => DOSYA_UZANTI.test(a.name)).forEach(a => {
                    const tur = a.name.split('.').pop().toLowerCase();
                    if (!tek[tur] || tercih(a) < tercih(tek[tur])) tek[tur] = a;
                });
                return Object.values(tek).map(a => ({ anahtar: k.replace(/[^a-z0-9]/g, ''),
                uygulama: UYGULAMA_ADI[k] || k.replace(/-/g, ' ').replace(/^./, c => c.toUpperCase()),
                ad: a.name, boyut: a.size, tarih: r.published_at, surum: r.tag_name, url: a.browser_download_url,
                }));
            });
        };
        const satir = (d) => {
            const tur = d.ad.split('.').pop().toLowerCase();
            const ara = `${d.uygulama} ${d.ad} ${d.surum || ''} dosya ${tur}`.toLocaleLowerCase('tr-TR');
            const alt = [d.surum, boyut(d.boyut), tarih(d.tarih)].filter(Boolean).join(' · ');
            return `<a class="dosya-satir" href="${escapeHtml(d.url)}" target="_blank" rel="noopener" download data-search="${escapeHtml(ara)}"><span class="dosya-tur ${tur}">${tur.toUpperCase()}</span><span class="dosya-bilgi"><span class="dosya-ad text-header block">${escapeHtml(d.uygulama)}</span><span class="dosya-alt block">${escapeHtml(d.ad)}${alt ? ' · ' + escapeHtml(alt) : ''}</span></span></a>`;
        };
        const grup = (baslik, liste) => liste.length ? `<p class="dosya-grup">${baslik}</p><div class="dosya-liste">${liste.sort((a, b) => a.uygulama.localeCompare(b.uygulama, 'tr')).map(satir).join('')}</div>` : '';

        let dosyaYuklendi = false;
        const dosyalariYukle = async () => {
            dosyaYuklendi = true;
            const kutu = document.getElementById('dosya-icerik');
            kutu.innerHTML = '<p class="dosya-not">Dosyalar GitHub\'dan alınıyor...</p>';
            const anahtar = anahtarAl();
            const [acik, acikSurum, rea] = await Promise.allSettled([
                ghJson('repos/gokhangeo/apk/contents/apk'),
                ghJson('repos/gokhangeo/apk/releases?per_page=100'),
                anahtar ? Promise.all([1, 2, 3].map(s => ghJson('repos/gokhangeo/rea/releases?per_page=100&page=' + s, anahtar))).then(s => s.flat()) : Promise.reject(new Error('yok')),
            ]);
            const acikDosyalar = (acik.status === 'fulfilled' ? acik.value : []).filter(f => f.type === 'file' && DOSYA_UZANTI.test(f.name))
                .map(f => ({ uygulama: f.name.replace(DOSYA_UZANTI, ''), ad: f.name, boyut: f.size, url: f.download_url }))
                .concat(acikSurum.status === 'fulfilled' ? sonSurumler(acikSurum.value) : []);
            let html;
            if (rea.status === 'fulfilled') {
                // Tek liste: Rea'daki son sürümler + apk deposunda olup Rea'da olmayanlar (NewPipe vb.)
                const reaDosyalar = sonSurumler(rea.value);
                const reaVar = new Set(reaDosyalar.map(d => d.anahtar));
                html = grup('Her uygulamanın son sürümü', reaDosyalar.concat(acikDosyalar.filter(d => !reaVar.has(d.uygulama.toLowerCase().replace(/[^a-z0-9]/g, '')))));
            } else html = grup('Herkese açık (apk deposu)', acikDosyalar);
            if (rea.status === 'fulfilled') {
                // tek liste yukarıda kuruldu
            } else if (!anahtar) {
                html += '<p class="dosya-not">Rea deposu gizli olduğu için EXE, IPA ve diğer APK\'lar görünmüyor. Bu cihazda bir kez <b>Rea anahtarı</b> düğmesiyle okuma anahtarını girin.</p>';
            } else {
                html += `<p class="dosya-not">Rea sürümleri alınamadı (${rea.reason && rea.reason.message === 'anahtar' ? 'anahtar geçersiz ya da süresi dolmuş' : 'bağlantı hatası'}). Rea anahtarı düğmesiyle yeni anahtar girin.</p>`;
            }
            kutu.innerHTML = html || '<p class="dosya-not">GitHub\'a ulaşılamadı. Biraz sonra Yenile\'ye basın.</p>';
            const q = document.getElementById('project-search').value.toLocaleLowerCase('tr-TR').trim();
            if (q) kutu.querySelectorAll('.dosya-satir').forEach(a => a.classList.toggle('hidden', !a.dataset.search.includes(q)));
        };
        document.getElementById('open-projects-modal').addEventListener('click', () => { if (!dosyaYuklendi) dosyalariYukle(); });
        document.getElementById('dosya-yenile').addEventListener('click', dosyalariYukle);
        document.getElementById('dosya-anahtar').addEventListener('click', () => {
            const yeni = prompt('Rea deposu için GitHub okuma anahtarı (fine-grained, yalnızca gokhangeo/rea → Contents: Read).\nBoş bırakıp Tamam derseniz kayıtlı anahtar silinir.', anahtarAl());
            if (yeni === null) return;
            try { yeni.trim() ? localStorage.setItem('reaToken', yeni.trim()) : localStorage.removeItem('reaToken'); } catch (e) {}
            dosyalariYukle();
        });

        // Başlangıç Kontrolü (oturum açıksa giriş ekranı <head> içinde zaten gizlendi)
        if (localStorage.getItem('isLoggedIn') === 'true') {
            performLogin(false);
        } else {
            passwordInput.focus();
        }
    });
    </script>
</body>
